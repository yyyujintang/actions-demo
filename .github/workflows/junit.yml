# Runs the JUnit tests on every push, on a fresh GitHub-hosted machine.
# The same commands we type on plank, plus two lines that install Java and JUnit.
name: JUnit

on: push                        # every push, to any branch

jobs:
  test:
    runs-on: ubuntu-latest      # a new Linux virtual machine for each run
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7          # copy the pushed commit onto the machine
      - uses: actions/setup-java@v6        # install Java 25
        with:
          distribution: oracle-openjdk
          java-version: '25'
      - name: Download JUnit
        run: curl -fsSL -o junit.jar https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/6.1.3/junit-platform-console-standalone-6.1.3.jar
      - name: Compile
        run: javac -Xlint:all -d out -cp junit.jar *.java
      - name: Run the tests          # a failing test exits non-zero, so the run is marked failed
        run: java -jar junit.jar execute --class-path out --scan-class-path --details=tree
